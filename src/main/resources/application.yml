spring:
  application:
    name: cloudops
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:cloudops}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

cloudops:
  monitoring:
    scheduler-enabled: ${MONITORING_SCHEDULER_ENABLED:true}
    poll-interval: ${MONITORING_POLL_INTERVAL:5s}
    batch-size: ${MONITORING_BATCH_SIZE:50}
    minimum-interval-seconds: ${MONITORING_MINIMUM_INTERVAL_SECONDS:30}
    retention-poll-interval: ${MONITORING_RETENTION_POLL_INTERVAL:1h}
    retention-batch-size: ${MONITORING_RETENTION_BATCH_SIZE:500}
    defaults:
      HTTP_CHECK: &default-timeout-probe
        enabled: true
        interval-seconds: 60
        failure-threshold: 3
        recovery-threshold: 2
        storage-mode: LATEST_ONLY
        timeout-ms: 5000
      PORT_CHECK:
        <<: *default-timeout-probe
        timeout-ms: 3000
      DNS_CHECK:
        enabled: true
        interval-seconds: 60
        failure-threshold: 3
        recovery-threshold: 2
        storage-mode: LATEST_ONLY
      PING:
        <<: *default-timeout-probe
        timeout-ms: 3000
      TLS_CHECK:
        <<: *default-timeout-probe
        timeout-ms: 5000
      SSH_CHECK:
        <<: *default-timeout-probe
        timeout-ms: 5000
  ssh:
    host-key-verification: ${SSH_HOST_KEY_VERIFICATION:ACCEPT_ALL}
    known-hosts-path: ${SSH_KNOWN_HOSTS_PATH:${user.home}/.ssh/known_hosts}
  task:
    messaging:
      exchange: ${TASK_EXCHANGE:cloudops.tasks}
      queue: ${TASK_QUEUE:cloudops.task.execute}
      routing-key: ${TASK_ROUTING_KEY:task.execute}
      dead-letter-exchange: ${TASK_DEAD_LETTER_EXCHANGE:cloudops.tasks.dlx}
      dead-letter-queue: ${TASK_DEAD_LETTER_QUEUE:cloudops.task.execute.dlq}
      dead-letter-routing-key: ${TASK_DEAD_LETTER_ROUTING_KEY:task.execute.dead}
    retry:
      enabled: ${TASK_RETRY_ENABLED:true}
      max-attempts: ${TASK_RETRY_MAX_ATTEMPTS:3}
      initial-interval: ${TASK_RETRY_INITIAL_INTERVAL:250ms}
      multiplier: ${TASK_RETRY_MULTIPLIER:2.0}
      max-interval: ${TASK_RETRY_MAX_INTERVAL:5s}
    lease:
      enabled: ${TASK_LEASE_ENABLED:true}
      duration: ${TASK_LEASE_DURATION:30s}
      heartbeat-interval: ${TASK_LEASE_HEARTBEAT_INTERVAL:10s}
      recovery-poll-interval: ${TASK_LEASE_RECOVERY_POLL_INTERVAL:15s}
      recovery-batch-size: ${TASK_LEASE_RECOVERY_BATCH_SIZE:50}
      max-recoveries: ${TASK_LEASE_MAX_RECOVERIES:3}
    outbox:
      enabled: ${TASK_OUTBOX_ENABLED:true}
      poll-interval: ${TASK_OUTBOX_POLL_INTERVAL:500ms}
      batch-size: ${TASK_OUTBOX_BATCH_SIZE:50}
  security:
    credentials:
      master-key: ${CREDENTIALS_MASTER_KEY}
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:cloudops}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
