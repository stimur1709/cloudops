spring:
  application:
    name: cloudops
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:cloudops}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

cloudops:
  task:
    messaging:
      exchange: ${TASK_EXCHANGE:cloudops.tasks}
      queue: ${TASK_QUEUE:cloudops.task.execute}
      routing-key: ${TASK_ROUTING_KEY:task.execute}
      dead-letter-exchange: ${TASK_DEAD_LETTER_EXCHANGE:cloudops.tasks.dlx}
      dead-letter-queue: ${TASK_DEAD_LETTER_QUEUE:cloudops.task.execute.dlq}
      dead-letter-routing-key: ${TASK_DEAD_LETTER_ROUTING_KEY:task.execute.dead}
    retry:
      enabled: ${TASK_RETRY_ENABLED:true}
      max-attempts: ${TASK_RETRY_MAX_ATTEMPTS:3}
      initial-interval: ${TASK_RETRY_INITIAL_INTERVAL:250ms}
      multiplier: ${TASK_RETRY_MULTIPLIER:2.0}
      max-interval: ${TASK_RETRY_MAX_INTERVAL:5s}
    outbox:
      enabled: ${TASK_OUTBOX_ENABLED:true}
      poll-interval: ${TASK_OUTBOX_POLL_INTERVAL:500ms}
      batch-size: ${TASK_OUTBOX_BATCH_SIZE:50}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:cloudops}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
