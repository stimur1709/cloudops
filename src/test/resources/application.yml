spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

cloudops:
  task:
    messaging:
      exchange: cloudops.tasks.test
      queue: cloudops.task.execute.test
      routing-key: task.execute.test
      dead-letter-exchange: cloudops.tasks.dlx.test
      dead-letter-queue: cloudops.task.execute.dlq.test
      dead-letter-routing-key: task.execute.dead.test
    retry:
      enabled: true
      max-attempts: 3
      initial-interval: 10ms
      multiplier: 2.0
      max-interval: 20ms
    outbox:
      enabled: true
      poll-interval: 100ms
      batch-size: 20

  security:
    jwt:
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      issuer: cloudops-test
      access-token-ttl: 15m
