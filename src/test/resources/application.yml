spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

cloudops:
  monitoring:
    scheduler-enabled: false
    poll-interval: 100ms
    batch-size: 20
    minimum-interval-seconds: 30
    retention-poll-interval: 1h
    retention-batch-size: 50
    defaults:
      HTTP_CHECK: &default-timeout-probe
        enabled: true
        interval-seconds: 30
        failure-threshold: 3
        recovery-threshold: 2
        storage-mode: LATEST_ONLY
        timeout-ms: 500
      PORT_CHECK:
        <<: *default-timeout-probe
      DNS_CHECK:
        enabled: true
        interval-seconds: 30
        failure-threshold: 3
        recovery-threshold: 2
        storage-mode: LATEST_ONLY
      PING:
        <<: *default-timeout-probe
      TLS_CHECK:
        <<: *default-timeout-probe
      SSH_CHECK:
        <<: *default-timeout-probe
  ssh:
    host-key-verification: ACCEPT_ALL
    known-hosts-path: ${java.io.tmpdir}/cloudops-test-known-hosts
  task:
    run-command:
      timeout: 3s
      max-output-bytes: 65536
    messaging:
      exchange: cloudops.tasks.test
      queue: cloudops.task.execute.test
      routing-key: task.execute.test
      dead-letter-exchange: cloudops.tasks.dlx.test
      dead-letter-queue: cloudops.task.execute.dlq.test
      dead-letter-routing-key: task.execute.dead.test
    retry:
      enabled: true
      max-attempts: 3
      initial-interval: 10ms
      multiplier: 2.0
      max-interval: 20ms
    lease:
      enabled: false
      duration: 30s
      heartbeat-interval: 10s
      recovery-poll-interval: 15s
      recovery-batch-size: 20
      max-recoveries: 3
    outbox:
      enabled: true
      poll-interval: 100ms
      batch-size: 20

  security:
    credentials:
      master-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    jwt:
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      issuer: cloudops-test
      access-token-ttl: 15m
